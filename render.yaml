# SafeGuard — Render Blueprint (Neon PostgreSQL)
# Create a new Blueprint from this file. Paste your Neon connection string
# when Render asks for DATABASE_URL (Dashboard → Connection string → URI).
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: safeguard-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/rename_tables_to_singular.sql && npx prisma db push --schema prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_IF_EMPTY
        value: "true"
      - key: ADMIN_EMAILS
        value: admin@safeguard.com
      - key: JWT_SECRET
        generateValue: true
      # Neon Postgres URI — set when creating the Blueprint (do not commit secrets)
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: safeguard-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: safeguard-web
    runtime: static
    rootDir: safe-harbor-platform
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: safeguard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: safeguard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_EMAILJS_SERVICE_ID
        value: service_91c0yld
      - key: VITE_EMAILJS_SOS_TEMPLATE_ID
        value: template_g1b2tqi
      - key: VITE_EMAILJS_RESET_TEMPLATE_ID
        value: template_cm8epcs
      - key: VITE_EMAILJS_PUBLIC_KEY
        value: 14kT7W4o1zCLRWbPA
