# SafeGuard — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# On first create, Render should only ask for MONGO_URI (Atlas).
# Do NOT set USE_LOCAL_MONGO=true on Render.

services:
  - type: web
    name: safeguard-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_LOCAL_MONGO
        value: "false"
      - key: SEED_IF_EMPTY
        value: "true"
      - key: ADMIN_EMAILS
        value: admin@safeguard.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: safeguard-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: safeguard-web
    runtime: static
    rootDir: safe-harbor-platform
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: safeguard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: safeguard-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_EMAILJS_SERVICE_ID
        value: service_91c0yld
      - key: VITE_EMAILJS_SOS_TEMPLATE_ID
        value: template_g1b2tqi
      - key: VITE_EMAILJS_RESET_TEMPLATE_ID
        value: template_cm8epcs
      - key: VITE_EMAILJS_PUBLIC_KEY
        value: 14kT7W4o1zCLRWbPA
